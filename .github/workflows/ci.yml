name: CI — Athlima API

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: athlima
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ── 1. Récupérer le code ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Installer PHP 8.2 ─────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, intl, opcache
          coverage: none

      # ── 3. Créer le .env AVANT composer install ───────────────────────────
      - name: Setup test environment
        working-directory: api
        run: |
          cat > .env << EOF
          APP_ENV=test
          APP_SECRET=testsecret123
          DEFAULT_URI=http://localhost
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/athlima?serverVersion=8.0&charset=utf8mb4
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=test
          EOF

      # ── 4. Installer les dépendances Composer ────────────────────────────
      - name: Install dependencies
        working-directory: api
        run: composer install --prefer-dist --no-progress --no-interaction

      # ── 5. Générer les clés JWT ───────────────────────────────────────────
      - name: Generate JWT keys
        working-directory: api
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem

      # ── 6. Créer la base de test (suffixe _test ajouté par doctrine.yaml) ──
      - name: Create test database
        working-directory: api
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/athlima?serverVersion=8.0&charset=utf8mb4
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      # ── 7. Appliquer les migrations ───────────────────────────────────────
      - name: Run migrations
        working-directory: api
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/athlima?serverVersion=8.0&charset=utf8mb4
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      # ── 8. Vider le cache ─────────────────────────────────────────────────
      - name: Clear cache
        working-directory: api
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/athlima?serverVersion=8.0&charset=utf8mb4
        run: php bin/console cache:clear --env=test

      # ── 9. Lancer les tests PHPUnit ───────────────────────────────────────
      - name: Run PHPUnit tests
        working-directory: api
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/athlima?serverVersion=8.0&charset=utf8mb4
        run: php bin/phpunit --testdox