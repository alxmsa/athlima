version: '3.9'

services:

  # ── Nginx — reverse proxy ──────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: athlima_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./api/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - athlima_net

  # ── API Symfony — PHP 8.2-fpm ──────────────────────────
  api:
    build:
      context: ./api
      dockerfile: ../docker/php/Dockerfile
    container_name: athlima_api
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}?serverVersion=8.0&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy
    networks:
      - athlima_net

  # ── MySQL 8.0 ──────────────────────────────────────────
  database:
    image: mysql:8.0
    container_name: athlima_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - athlima_net

  # ── phpMyAdmin ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: athlima_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - database
    networks:
      - athlima_net

volumes:
  mysql_data:
    driver: local

networks:
  athlima_net:
    driver: bridge